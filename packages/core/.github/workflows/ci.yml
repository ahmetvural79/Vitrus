name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval # zorunlu kapı: kaynak isabeti ≥%90, boşluk recall/precision %100
      - run: npm run leak-test # SERT KAPI: yetkisiz-erişim sızıntısı = 0 (istisnasız)
