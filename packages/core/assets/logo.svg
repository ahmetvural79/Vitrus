<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="Vitrus — your glass-box company brain">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#D6EEFB"/><stop offset="1" stop-color="#9FD6F2"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FCBEC"/><stop offset="1" stop-color="#5FA8DA"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74B7E4"/><stop offset="1" stop-color="#4A8FC8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF3C4"/><stop offset="0.4" stop-color="#F7C948" stop-opacity="0.85"/><stop offset="1" stop-color="#F7C948" stop-opacity="0"/></radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F5A623"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FCBEC"/><stop offset="0.55" stop-color="#A5B4FC"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  </defs>

  <!-- mark (cube + golden sparkle), placed at left -->
  <g transform="translate(8,15)">
    <g opacity="0.95">
      <polygon points="60,16 102,40 60,64 18,40" fill="url(#t)"/>
      <polygon points="18,40 60,64 60,108 18,84" fill="url(#l)"/>
      <polygon points="102,40 102,84 60,108 60,64" fill="url(#r)"/>
    </g>
    <g stroke="#BFE3F6" stroke-width="1" opacity="0.55" fill="none">
      <path d="M60,16 L60,64 M18,40 L102,40 M18,40 L60,108 M60,64 L18,84 M102,40 L60,108 M60,64 L102,84"/>
    </g>
    <g stroke="#3E83BC" stroke-width="2.4" stroke-linejoin="round" fill="none">
      <polygon points="60,16 102,40 102,84 60,108 18,84 18,40"/>
      <path d="M60,16 L60,64 M18,40 L60,64 M102,40 L60,64 M60,64 L60,108"/>
    </g>
    <circle cx="60" cy="62" r="26" fill="url(#glow)"/>
    <g stroke="#F7C948" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <line x1="60" y1="34" x2="60" y2="42"/><line x1="60" y1="82" x2="60" y2="90"/>
      <line x1="32" y1="62" x2="40" y2="62"/><line x1="80" y1="62" x2="88" y2="62"/>
      <line x1="42" y1="44" x2="47" y2="49"/><line x1="73" y1="75" x2="78" y2="80"/>
      <line x1="78" y1="44" x2="73" y2="49"/><line x1="47" y1="75" x2="42" y2="80"/>
    </g>
    <path d="M60,40 L65,57 L82,62 L65,67 L60,84 L55,67 L38,62 L55,57 Z" fill="url(#star)" stroke="#FFF6D8" stroke-width="0.8"/>
    <circle cx="60" cy="62" r="3.2" fill="#FFF6D8"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#word)">Vitrus</text>
  <text x="152" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="16.5" font-weight="500" letter-spacing="0.2" fill="#7e8aa3">your glass-box company brain</text>
</svg>
