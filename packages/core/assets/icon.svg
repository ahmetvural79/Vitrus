<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Vitrus">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#D9EFFB"/><stop offset="1" stop-color="#A9D8F0"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD0EC"/><stop offset="1" stop-color="#6FB1DE"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC4E6"/><stop offset="1" stop-color="#5C9FD2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF3C4"/><stop offset="0.45" stop-color="#F7C948" stop-opacity="0.8"/><stop offset="1" stop-color="#F7C948" stop-opacity="0"/></radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD45C"/><stop offset="1" stop-color="#F0A91F"/></linearGradient>
  </defs>

  <!-- glass faces (transparent cube seen corner-on = hexagon) -->
  <g opacity="0.96">
    <polygon points="60,14 102,38 60,62 18,38" fill="url(#t)"/>
    <polygon points="18,38 60,62 60,110 18,86" fill="url(#l)"/>
    <polygon points="102,38 102,86 60,110 60,62" fill="url(#r)"/>
  </g>
  <!-- facet shimmer (gem-cut highlights) -->
  <g fill="#FFFFFF">
    <polygon points="60,14 102,38 60,38" opacity="0.14"/>
    <polygon points="60,14 18,38 60,38" opacity="0.08"/>
    <polygon points="18,86 60,62 60,110" opacity="0.10"/>
    <polygon points="102,38 102,86 60,62" opacity="0.07"/>
  </g>
  <!-- gem chords (facet cuts across the faces) -->
  <g stroke="#CFE9F8" stroke-width="1.2" opacity="0.6" fill="none">
    <path d="M18,38 L102,38 M18,86 L102,86"/>
  </g>
  <!-- full wireframe: back corner edges seen THROUGH the glass... -->
  <g stroke="#8FC3E4" stroke-width="1.7" opacity="0.85" fill="none">
    <path d="M60,14 L60,62 M18,86 L60,62 M102,86 L60,62"/>
  </g>
  <!-- ...and front corner edges -->
  <g stroke="#4E94C9" stroke-width="2" stroke-linejoin="round" fill="none">
    <path d="M18,38 L60,62 M102,38 L60,62 M60,62 L60,110"/>
  </g>
  <!-- outer edges (silhouette) -->
  <polygon points="60,14 102,38 102,86 60,110 18,86 18,38" fill="none" stroke="#2E7CB8" stroke-width="3" stroke-linejoin="round"/>

  <!-- the golden star INSIDE the box: glow + rays + tall 4-point star over the inner edges -->
  <circle cx="60" cy="62" r="28" fill="url(#glow)"/>
  <g stroke="#F0B429" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <line x1="40" y1="42" x2="48" y2="50"/><line x1="72" y1="74" x2="80" y2="82"/>
    <line x1="80" y1="42" x2="72" y2="50"/><line x1="48" y1="74" x2="40" y2="82"/>
    <line x1="34" y1="62" x2="43" y2="62"/><line x1="77" y1="62" x2="86" y2="62"/>
    <line x1="66" y1="38" x2="70" y2="44"/><line x1="54" y1="86" x2="50" y2="80"/>
    <line x1="51" y1="36" x2="54" y2="42"/><line x1="69" y1="88" x2="66" y2="82"/>
  </g>
  <path d="M60,32 L66.5,55.5 L84,62 L66.5,68.5 L60,92 L53.5,68.5 L36,62 L53.5,55.5 Z" fill="url(#star)" stroke="#FFE9A8" stroke-width="1"/>
</svg>
